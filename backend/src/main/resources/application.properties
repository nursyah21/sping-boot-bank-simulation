spring.application.name=demo
server.port=8000
server.servlet.context-path=/api

spring.boot.admin.client.url=http://localhost:9000
spring.boot.admin.client.instance.management-url=http://localhost:8000/api/actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*

spring.thymeleaf.check-template-location=false

spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# secret key must use base64 and 256 bytes
jwt.secret=YXNkc2FkbnFpZG5xd2Rvd3FuZG93cWttZHFvd25kaXFqbmNzYWtjbmFsc2tkbnNhbGRuc2FkbmFzbGtkbg
# access token 1 hour
jwt.expiration.ms=3600000

spring.jackson.default-property-inclusion=non_null

spring.profiles.active=prod